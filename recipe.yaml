package:
  name: sqlite
  version: "0.2.0"

source:
  path: .

build:
  script:
    - mkdir -p $PREFIX/lib/mojo
    - cp -r sqlite $PREFIX/lib/mojo/

requirements:
  host:
    - mojo >=1.0.0,<1.1.0
  run:
    - mojo >=1.0.0,<1.1.0

about:
  summary: SQLite bindings with morph ORM integration for Mojo
  license: MIT
