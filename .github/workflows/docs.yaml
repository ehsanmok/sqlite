name: Docs

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: dev
          # Pin pixi: the default "latest" ships a build-api-version >=5
          # that this repo's pixi-build-rattler-build 0.3.13 backend can't
          # satisfy, failing the solve with "no candidates were found".
          # 0.70.2 is the newest pixi compatible with that backend.
          pixi-version: v0.70.2
          cache: false
          post-cleanup: false

      - name: Build docs
        run: pixi run -e dev docs-build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
